<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>دیبا | فروشگاه اینترنتی پوشاک</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF7F2;
      --bs: #F2ECE2;
      --sf: #fff;
      --tx: #241F1A;
      --ts: #6B625A;
      --bd: #E6DFD3;
      --ac: #C1694F;
      --ad: #A6523B;
      --as: #F1DAD1;
      --go: #A98A4A;
      --fb: #1E1A16;
      color-scheme: light
    }

    [data-t=dark] {
      --bg: #18140F;
      --bs: #221C15;
      --sf: #241E17;
      --tx: #F3ECE3;
      --ts: #B7AB9C;
      --bd: #3A3025;
      --ad: #E08A68;
      --as: #3A281F;
      --go: #CBAA66;
      --fb: #120F0B;
      color-scheme: dark
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html,
    body {
      min-height: 100%
    }

    body {
      font-family: Vazirmatn, system-ui, sans-serif;
      background: var(--bg);
      color: var(--tx);
      line-height: 1.7;
      transition: background .3s, color .3s
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      border: 0;
      background: none
    }

    img {
      display: block;
      max-width: 100%
    }

    :focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 2px
    }

    .w {
      padding-inline: clamp(16px, 4vw, 64px)
    }

    @keyframes fu {
      from {
        opacity: 0;
        transform: translateY(16px)
      }
    }

    .fu {
      animation: fu .5s both
    }

    .na .fu {
      animation: none
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    header.h {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--sf);
      border-bottom: 1px solid var(--bd);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-block: 12px;
      padding-top: calc(12px + env(safe-area-inset-top))
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 22px
    }

    .logo i {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--ac);
      color: #fff;
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 16px
    }

    nav.dn {
      display: flex;
      gap: 24px
    }

    nav.dn button {
      font-weight: 500;
      padding: 6px 2px;
      border-bottom: 2px solid transparent
    }

    nav.dn button.on,
    nav.dn button:hover {
      color: var(--ac);
      border-color: var(--ac)
    }

    .ib {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--bd);
      background: var(--sf);
      display: grid;
      place-items: center;
      position: relative;
      font-size: 17px;
      flex: none
    }

    .bg {
      position: absolute;
      top: -4px;
      left: -4px;
      background: var(--ac);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      padding: 0 4px;
      font-style: normal
    }

    .bn {
      display: none;
      position: fixed;
      inset: auto 0 0 0;
      z-index: 40;
      background: var(--sf);
      border-top: 1px solid var(--bd);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      grid-template-columns: repeat(4, 1fr)
    }

    .bn button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      font-size: 11px;
      color: var(--ts)
    }

    .bn button.on {
      color: var(--ac);
      font-weight: 700
    }

    .bn span {
      display: grid;
      place-items: center;
      height: 26px;
      position: relative
    }

    @media(max-width:900px) {
      nav.dn {
        display: none
      }

      .bn {
        display: grid
      }

      body {
        padding-bottom: calc(64px + env(safe-area-inset-bottom))
      }
    }

    .bp {
      background: var(--ac);
      color: #fff;
      padding: 13px 26px;
      border-radius: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s
    }

    .bp:hover {
      background: var(--ad)
    }

    .bp.full {
      width: 100%
    }

    .bp.gn {
      background: #3F7D58
    }

    .bp:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .bs2 {
      background: var(--bs);
      padding: 12px 22px;
      border-radius: 14px;
      font-weight: 700;
      width: 100%;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px
    }

    .ic {
      flex: none
    }

    .ib .ic {
      display: block
    }

    .pt {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .bgh {
      border: 1.5px solid rgba(255, 255, 255, .6);
      color: #fff;
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 700
    }

    input[type=text],
    textarea {
      background: var(--bs);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 11px 14px;
      width: 100%;
      outline: 0
    }

    input:focus,
    textarea:focus {
      border-color: var(--ac)
    }

    textarea {
      resize: vertical
    }

    .hero {
      position: relative;
      min-height: min(600px, 80dvh);
      display: flex;
      align-items: center;
      overflow: hidden;
      border-radius: 0 0 32px 32px;
      color: #fff
    }

    .hero>img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .hero:before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(270deg, rgba(20, 16, 12, .8), rgba(20, 16, 12, .15));
      z-index: 1
    }

    .hero .in {
      position: relative;
      z-index: 2;
      padding-block: 56px;
      max-width: 640px
    }

    .hero h1 {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 800;
      line-height: 1.4;
      margin: 18px 0 12px
    }

    .hero p {
      opacity: .88;
      max-width: 480px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .3);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600
    }

    .hb {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px
    }

    .sec {
      padding-block: clamp(28px, 5vw, 60px) 0
    }

    .tt {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 800
    }

    .sb {
      color: var(--ts);
      font-size: 14px;
      margin-bottom: 20px
    }

    .cats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px
    }

    .cat {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 4/3.4;
      color: #fff
    }

    .cat img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s
    }

    .cat:hover img {
      transform: scale(1.07)
    }

    .cat:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(15, 12, 9, .8), transparent 60%)
    }

    .cat b {
      position: absolute;
      right: 16px;
      bottom: 12px;
      z-index: 2;
      font-size: 18px
    }

    .fb {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 20px
    }

    .fb input,
    .fb select {
      background: var(--bs);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 9px 14px;
      outline: 0
    }

    .fb input {
      flex: 1 1 220px;
      min-width: 0;
      width: auto
    }

    .pf {
      padding: 8px 16px;
      border-radius: 99px;
      background: var(--bs);
      color: var(--ts);
      font-weight: 600;
      font-size: 13.5px
    }

    .pf.on {
      background: var(--ac);
      color: #fff
    }

    .gr {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px
    }

    @media(max-width:560px) {
      .gr {
        grid-template-columns: 1fr 1fr;
        gap: 12px
      }

      .hero .in {
        padding-block: 40px
      }
    }

    .cd {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .3s, box-shadow .3s
    }

    .cd:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 36px rgba(0, 0, 0, .12)
    }

    .im {
      aspect-ratio: 3/3.6;
      overflow: hidden;
      background: var(--bs);
      position: relative;
      cursor: pointer
    }

    .im img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s
    }

    .cd:hover .im img {
      transform: scale(1.06)
    }

    .dc {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #C0392B;
      color: #fff;
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 9px
    }

    .cb {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1
    }

    .cb small {
      color: var(--ac);
      font-weight: 700;
      font-size: 11.5px
    }

    .cb h3 {
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.6
    }

    .star {
      color: var(--go);
      font-size: 12px
    }

    .star span {
      color: var(--ts)
    }

    .pr {
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap
    }

    .pr b {
      font-size: 15.5px;
      font-weight: 800
    }

    .pr s {
      color: var(--ts);
      font-size: 12.5px
    }

    .dots {
      display: flex;
      gap: 6px
    }

    .dots i {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      box-shadow: 0 0 0 1px var(--bd)
    }

    .qa {
      margin-top: auto;
      background: var(--bs);
      border-radius: 12px;
      padding: 9px;
      font-weight: 700;
      font-size: 13px
    }

    .qa:hover {
      background: var(--ac);
      color: #fff
    }

    .bc {
      padding-top: 16px;
      font-size: 13px;
      color: var(--ts)
    }

    .bc button {
      color: var(--ts)
    }

    .bc button:hover {
      color: var(--ac)
    }

    .pd {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(20px, 4vw, 48px);
      padding-block: 20px 30px
    }

    @media(max-width:900px) {
      .pd {
        grid-template-columns: 1fr
      }
    }

    .gm {
      border-radius: 24px;
      overflow: hidden;
      aspect-ratio: 3/3.4;
      background: var(--bs);
      position: relative
    }

    .gm img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .th {
      display: flex;
      gap: 10px;
      margin-top: 12px
    }

    .th button {
      width: 72px;
      height: 84px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid transparent;
      opacity: .6
    }

    .th button.on {
      border-color: var(--ac);
      opacity: 1
    }

    .th img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .pd h1 {
      font-size: clamp(22px, 3vw, 27px);
      font-weight: 800;
      line-height: 1.5
    }

    .meta {
      color: var(--ts);
      font-size: 13px;
      margin: 6px 0 14px
    }

    .pb {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .pb b {
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 800
    }

    .pb s {
      color: var(--ts)
    }

    .tag {
      background: var(--as);
      color: var(--ad);
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px
    }

    .ol {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px
    }

    .ol span {
      font-weight: 400;
      color: var(--ts)
    }

    .sw {
      display: flex;
      gap: 10px;
      margin-bottom: 18px
    }

    .sw button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid var(--sf);
      box-shadow: 0 0 0 1.5px var(--bd)
    }

    .sw button.on {
      box-shadow: 0 0 0 2.5px var(--ac)
    }

    .sz {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    .sz button {
      min-width: 46px;
      height: 44px;
      border-radius: 12px;
      border: 1.5px solid var(--bd);
      background: var(--sf);
      font-weight: 700;
      padding: 0 12px
    }

    .sz button.on {
      background: var(--tx);
      color: var(--bg);
      border-color: var(--tx)
    }

    .sz button:disabled {
      opacity: .35;
      text-decoration: line-through;
      cursor: not-allowed
    }

    .sk {
      font-size: 12.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .qr {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      font-weight: 700
    }

    .sp {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--bd);
      border-radius: 12px;
      overflow: hidden
    }

    .sp button {
      width: 38px;
      height: 40px;
      background: var(--bs);
      font-weight: 700;
      font-size: 17px
    }

    .sp span {
      min-width: 36px;
      text-align: center;
      font-weight: 700
    }

    .dv {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px
    }

    .dv div {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 150px;
      background: var(--bs);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12.5px
    }

    .tb {
      display: flex;
      border-bottom: 1.5px solid var(--bd);
      margin-bottom: 20px;
      overflow-x: auto
    }

    .tb button {
      padding: 12px 18px;
      font-weight: 700;
      color: var(--ts);
      border-bottom: 2.5px solid transparent;
      margin-bottom: -1.5px;
      white-space: nowrap
    }

    .tb button.on {
      color: var(--ac);
      border-color: var(--ac)
    }

    .tc {
      max-width: 780px;
      line-height: 2.1;
      color: var(--ts);
      padding-bottom: 30px
    }

    .spt {
      width: 100%;
      border-collapse: collapse
    }

    .spt td {
      padding: 12px 4px;
      border-bottom: 1px solid var(--bd);
      color: var(--tx)
    }

    .spt td:first-child {
      color: var(--ts);
      width: 40%
    }

    .rv {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--bd)
    }

    .rv img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      flex: none
    }

    .stp span {
      font-size: 26px;
      cursor: pointer;
      color: var(--bd)
    }

    .stp span.on {
      color: var(--go)
    }

    .wr {
      background: var(--bs);
      border-radius: 18px;
      padding: 20px;
      margin-top: 14px
    }

    .wr textarea {
      background: var(--sf);
      margin: 10px 0;
      min-height: 90px
    }

    .wrap {
      padding-block: 28px 40px
    }

    .steps {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px
    }

    .sc {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ts)
    }

    .sc i {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bs);
      border: 2px solid var(--bd);
      display: grid;
      place-items: center;
      font-style: normal;
      font-weight: 700
    }

    .sc.on {
      color: var(--tx)
    }

    .sc.on i {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff
    }

    .sc.dn i {
      background: #3F7D58;
      border-color: #3F7D58;
      color: #fff
    }

    .sl {
      width: clamp(20px, 8vw, 70px);
      height: 2px;
      background: var(--bd);
      margin: 0 8px
    }

    @media(max-width:560px) {
      .sc span {
        display: none
      }

      .sc.on span {
        display: inline
      }
    }

    .ly {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 24px;
      align-items: start
    }

    @media(max-width:900px) {
      .ly {
        grid-template-columns: 1fr
      }
    }

    .pn {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: clamp(16px, 3vw, 26px)
    }

    .pt {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px
    }

    .cr {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--bd);
      flex-wrap: wrap
    }

    .cr img {
      width: 70px;
      height: 82px;
      object-fit: cover;
      border-radius: 12px
    }

    .f1 {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      align-items: flex-start
    }

    .f1 small {
      color: var(--ts)
    }

    .rm {
      color: #C0392B;
      font-size: 12px
    }

    .lt {
      min-width: 110px;
      text-align: left
    }

    .sr {
      display: flex;
      justify-content: space-between;
      color: var(--ts);
      font-size: 13.5px;
      margin-bottom: 12px
    }

    .sr b {
      color: var(--tx)
    }

    .tot {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 800;
      padding-top: 14px;
      border-top: 1.5px dashed var(--bd);
      margin-bottom: 18px
    }

    .cdr {
      display: flex;
      gap: 8px;
      margin: 16px 0 10px
    }

    .cdr button {
      background: var(--tx);
      color: var(--bg);
      padding: 0 18px;
      border-radius: 10px;
      font-weight: 700
    }

    .fg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px
    }

    @media(max-width:560px) {
      .fg {
        grid-template-columns: 1fr
      }
    }

    .fl label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ts);
      margin-bottom: 6px
    }

    .op {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1.5px solid var(--bd);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 10px;
      width: 100%;
      text-align: right
    }

    .op.on {
      border-color: var(--ac);
      background: var(--as)
    }

    .op>span {
      flex: 1
    }

    .op small {
      display: block;
      color: var(--ts);
      font-size: 11.5px
    }

    .rd {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--bd);
      flex: none
    }

    .on .rd {
      border: 5px solid var(--ac)
    }

    .pg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px
    }

    .pg button {
      border: 1.5px solid var(--bd);
      border-radius: 14px;

</head>

        return `<div class="ad"><aside class="an"><div class="logo br" style="padding:0 6px 16px;font-size:18px"><i>د</i>پنل مدیریت دیبا</div>${[['dash', 'chart', 'داشبورد'], ['prod', 'shirt', 'محصولات و موجودی'], ['ord', 'pkg', 'سفارش‌ها'], ['disc', 'tag', 'تخفیف و کد تخفیف']].map(([k, i, t]) => `<button class="${s == k ? 'on' : ''}" data-a="adm" data-v="${k}">${I(i, 18)}${t}</button>`).join('')}<hr><button class="br" data-a="nav" data-v="home">${I('back', 18)}بازگشت به فروشگاه</button></aside><main class="am fu"><div class="tp"><h1>${TT[s]}</h1><button class="ib" data-a="theme" aria-label="تغییر پوسته">${I(G.dark ? 'sun' : 'moon')}</button></div>${b}</main></div>`
      };

    /* ---------- render / actions ---------- */
    function render(anim) {
      const [n, a] = R(); if (n == 'product' && G.pv.pid != a) initPv(a); const y = scrollY, app = $('#app'),
        pg = {home, shop: home, product: prod, cart, admin}[n] || home, nn = pg == home ? (n == 'shop' ? 'shop' : 'home') : n;
      app.className = anim ? '' : 'na';
      app.innerHTML = (nn == 'admin' ? '' : head(nn)) + pg() + (nn == 'admin' ? '' : foot()) + bn(nn);
      if (anim) {const s = $('#shop'); scrollTo(0, n == 'shop' && s ? s.offsetTop - 70 : 0)} else scrollTo(0, y)
    }
    const A = {
      nav: v => nav(v),
      theme() {G.dark = !G.dark; document.documentElement.dataset.t = G.dark ? 'dark' : ''; try {localStorage.setItem('dt', +G.dark)} catch (e) { } render(false)},
      open: v => nav('product/' + v),
      cat(v) {G.cat = v; render(false)},
      catgo(v) {G.cat = v; R()[0] == 'shop' ? render(true) : nav('shop')},
      qadd(v) {const p = PP(v); addCart(+v, 0, fav(p, 0), 1); render(false); toast('«' + p.t + '» به سبد اضافه شد')},
      pc(v) {G.pv.c = +v; G.pv.s = fav(PP(G.pv.pid), +v); G.pv.q = 1; render(false)},
      ps(v) {G.pv.s = +v; G.pv.q = 1; render(false)},
      pq(v) {const p = PP(G.pv.pid), n = stk(p, G.pv.c, G.pv.s); G.pv.q = Math.max(1, Math.min(G.pv.q + +v, n || 1)); render(false)},
      im(v) {G.pv.im = +v; render(false)}, tab(v) {G.pv.tab = v; render(false)}, rate(v) {G.pv.rt = +v; render(false)}, send() {G.pv.sent = 1; render(false)},
      add() {const v = G.pv; addCart(v.pid, v.c, v.s, v.q); v.added = 1; render(false); toast('به سبد خرید اضافه شد'); setTimeout(() => {v.added = 0; R()[0] == 'product' && render(false)}, 1800)},
      cinc(i) {G.cart[i].q = Math.min(9, G.cart[i].q + 1); render(false)},
      cdec(i) {G.cart[i].q = Math.max(1, G.cart[i].q - 1); render(false)},
      crm(i) {G.cart.splice(i, 1); render(false)},
      apply() {const c = G.code.trim().toUpperCase(); G.ap = G.dis.find(d => d.on && d.c == c) || 'bad'; render(false)},
      step(v) {G.step = +v; render(true)}, ship(v) {G.ship = v; render(false)}, paysel(v) {G.pay = v; render(false)},
      fin() {G.order = {no: '#DB-' + (100000 + Math.floor(Math.random() * 900000)), d: new Date().toLocaleString('fa-IR', {dateStyle: 'long', timeStyle: 'short'}), tot: T().tot, sh: SH[G.ship][0]}; G.step = 4; render(true)},
      done() {G.cart = []; G.step = 1; G.ap = null; G.code = ''; nav('home')},
      adm(v) {G.sec = v; render(true)},
      ptog(i) {G.prod[i][2] ^= 1; render(false)},
      oadv(i) {G.ord[i][4] = Math.min(2, G.ord[i][4] + 1); render(false)},
      dtog(i) {G.dis[i].on ^= 1; render(false)}
    };
    document.addEventListener('click', e => {const a = e.target.closest('[data-a]'); if (a && !a.disabled) A[a.dataset.a](a.dataset.v)});
    document.addEventListener('input', e => {
      const b = e.target.dataset.b; if (!b) return; const v = e.target.value;
      if (b == 'q') {G.q = v; upd()} else if (b == 'sort') {G.sort = v; upd()} else if (b == 'code') G.code = v; else if (b == 'rv') G.pv.rv = v; else G.f[b] = v
    });
    try {G.dark = localStorage.getItem('dt') == '1'} catch (e) { }
    document.documentElement.dataset.t = G.dark ? 'dark' : '';
    addEventListener('hashchange', () => render(true));
    render(true);
  </script>
</body>
